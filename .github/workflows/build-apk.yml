name: Build RICHA Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        cd android-project
        chmod +x gradlew
      continue-on-error: true

    - name: Build with Gradle
      run: |
        cd android-project
        ./gradlew assembleDebug || gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RICHA-AI-Companion-Debug-APK
        path: android-project/app/build/outputs/apk/debug/*.apk
        
